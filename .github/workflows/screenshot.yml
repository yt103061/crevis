name: Take LP Screenshot

on:
  workflow_dispatch:
    inputs:
      lp_id:
        description: 'LP ID in Supabase (leave blank for batch mode)'
        required: false
      url:
        description: 'Target URL (leave blank for batch mode)'
        required: false

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install puppeteer @aws-sdk/client-s3 @supabase/supabase-js
      - name: Take screenshot and upload to R2
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ inputs.lp_id }}" ] && [ -n "${{ inputs.url }}" ]; then
            node scripts/screenshot.js "${{ inputs.lp_id }}" "${{ inputs.url }}"
          else
            node scripts/screenshot.js --batch
          fi
